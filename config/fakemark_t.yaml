# Base path to perform experiment — override via CLI:
#   python main.py config/fakemark_t.yaml --base_path /your/workdir
base_path: !PLACEHOLDER
exp_name: exp
data_folder: !ref <base_path>/Data
protocol_folder: ./protocols
collaborator_out_class: 6
# Path to save exp log and checkpoints
output_folder: !ref <base_path>/Log/exps-watermark/exp_<exp_name>
# where checkpoints will be saved
save_folder: !ref <output_folder>/save
# where audio samples will be saved during training
wav_folder: !ref <output_folder>/wavs
# Logging file for every N optimizer steps (many lines)
train_steps_log: !ref <output_folder>/train_steps_log.txt
# Logging file per epoch
train_stage_log: !ref <output_folder>/exp_log.txt
# Save path for evaluation score
score_path: !ref <output_folder>/evaluation_score.txt
# Random seed
seed: 1234

# Protocol files to read
train_csv: !ref <protocol_folder>/train.csv
valid_csv: !ref <protocol_folder>/valid.csv
test_csv: !ref <protocol_folder>/test.csv

################################
# Experiment settings #
################################
log_interval: 100
batch_size: 8
epochs: 100
num_workers: 8
add_distortion: True 
sample_rate: 16000
precision: fp16
ckpt_interval_hours: 23
# whether use true logit for collab target
# or use random int as collob target
use_logit: True
emb_size: 256

################################
# Dynamic batching settings #
################################
max_batch_length: 40
dynamic_batch_sampler_train:
   max_batch_length: !ref <max_batch_length>
   num_buckets: 10
   shuffle: True
   batch_ordering: random

################################
# Watermarking #
################################
watermark_backend: timbre
source_tracing_num_labels: 24 

################################
# Network Hyperparameters #
################################
n_fft: 1024
hop_length: 256
win_length: !ref <n_fft>
n_mel_channels: 80
mel_fmin: 0.0
mel_fmax: 8000
mel_normalized: False
power: 1
norm: "slaney"
mel_scale: "slaney"
dynamic_range_compression: True
layers_CE: 3
layers_EM: 4
hidden_dim: 64

################################
# Generator Loss #
################################
stft_loss: null
#stft_loss: !new:speechbrain.lobes.models.HifiGAN.MultiScaleSTFTLoss
mseg_loss: !new:speechbrain.lobes.models.HifiGAN.MSEGLoss
feat_match_loss: !new:speechbrain.lobes.models.HifiGAN.MelganFeatureLoss
l1_spec_loss: !new:speechbrain.lobes.models.HifiGAN.L1SpecLoss
  sample_rate: !ref <sample_rate>
  hop_length: !ref <hop_length>
  win_length: !ref <win_length>
  n_mel_channels: !ref <n_mel_channels>
  n_fft: !ref <n_fft>
  n_stft: !ref <n_fft> // 2 + 1
  mel_fmin: !ref <mel_fmin>
  mel_fmax: null
  mel_normalized: !ref <mel_normalized>
  power: !ref <power>
  dynamic_range_compression: !ref <dynamic_range_compression>

generator_loss: !new:speechbrain.lobes.models.HifiGAN.GeneratorLoss
  stft_loss: !ref <stft_loss>
  stft_loss_weight: 0 
  mseg_loss: !ref <mseg_loss>
  mseg_loss_weight: 1 
  feat_match_loss: !ref <feat_match_loss>
  feat_match_loss_weight: !ref <lambda_feat_match>
  l1_spec_loss: !ref  <l1_spec_loss>
  l1_spec_loss_weight: !ref <lambda_l1_spec>

################################
# Discriminator Loss #
################################
msed_loss: !new:speechbrain.lobes.models.HifiGAN.MSEDLoss

discriminator_loss: !new:speechbrain.lobes.models.HifiGAN.DiscriminatorLoss
  msed_loss: !ref <msed_loss>

################################
# Loudness loss used for watermark signal #
################################
loudness_loss: !new:models.loudnessloss.TFLoudnessRatio
  sample_rate: !ref <sample_rate>
  segment: 0.5
  overlap: 0.5
  n_bands: 6
  clip_min: -100.
  temperature: 1.

################################
# Modules #
################################
encoder: !new:models.modules.Encoder
  msg_length: !ref <source_tracing_num_labels>
  layers_CE: !ref <layers_CE>
  layers_EM: !ref <layers_EM>
  hidden_dim: !ref <hidden_dim>

discriminator: !new:speechbrain.lobes.models.HifiGAN.HifiganDiscriminator

collaborator: !new:models.W2V.Model
  model_name: mms_300m
  checkpoint_path: facebook/mms-300m
  v_out_class: !ref <source_tracing_num_labels> 

modules:
   encoder: !ref <encoder>
   discriminator: !ref <discriminator>
   collaborator: !ref <collaborator>

################################
# Optimization Hyperparameters #
################################
# Approximate: 1k steps ≈ 1 hour on a single A100 GPU
lr: 1e-4
msg_warmup: 2000
optimizer_step_limit: 50000
valid_step: 1000
adam_b1: 0.8
adam_b2: 0.99
warmup: 2000

lambda_g_col: 10.0
lambda_col : 10.0
lambda_sc: 1.0
lambda_ssn: 1.0
lambda_gen: 7.0
lambda_loud: 10.0
lambda_l1: 0.1
lambda_feat_match: 1.0
lambda_l1_spec: 1.0


#optimizer
opt_class_generator: !name:torch.optim.AdamW
  lr: !ref <lr>
  betas: [!ref <adam_b1>, !ref <adam_b2>]

opt_class_discriminator: !name:torch.optim.AdamW
  lr: !ref <lr>
  betas: [!ref <adam_b1>, !ref <adam_b2>]

scheduler_generator: !new:speechbrain.nnet.schedulers.WarmAndExpDecayLRSchedule
  lr: !ref <lr>
  n_warmup_steps: !ref <warmup>
  total_steps: !ref <optimizer_step_limit>
  decay_factor: 0.01

scheduler_discriminator: !new:speechbrain.nnet.schedulers.WarmAndExpDecayLRSchedule
  lr: !ref <lr>
  n_warmup_steps: !ref <warmup>
  total_steps: !ref <optimizer_step_limit>
  decay_factor: 0.01

epoch_counter: !new:speechbrain.utils.epoch_loop.EpochCounter
  limit: !ref <epochs>

train_stage_logger: !new:speechbrain.utils.train_logger.FileTrainLogger
  save_file: !ref <train_stage_log>

train_steps_logger: !new:speechbrain.utils.train_logger.TensorboardLogger
   save_dir: !ref <output_folder>/train_steps_log

#checkpointer
checkpointer: !new:speechbrain.utils.checkpoints.Checkpointer
  checkpoints_dir: !ref <save_folder>
  recoverables:
    encoder: !ref <encoder>
    discriminator: !ref <discriminator>
    counter: !ref <epoch_counter>
    collaborator: !ref <collaborator>
